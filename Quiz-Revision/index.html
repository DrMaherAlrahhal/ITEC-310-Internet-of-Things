
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITEC 310 · Interactive IoT Question Bank</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#102944;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#082f5b,#0c518e);color:#fff;padding:22px clamp(20px,3vw,48px)}h1{font-size:clamp(24px,2.4vw,36px);margin:0 0 10px}header p{margin:0;color:#e3edf8}main{padding:22px clamp(16px,2vw,32px);max-width:1800px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}.tab,.action{border:1px solid #d6e0ec;background:#fff;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:700;color:#0b2946;cursor:pointer}.tab.active{background:#0b4d8b;color:#fff;border-color:#0b4d8b}.tab:hover,.action:hover{border-color:#4a95d2}.intro{color:#355474;line-height:1.6;margin:0 0 18px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.stat{background:#e6f1ff;border:1px solid #bcd7f7;padding:13px 16px;border-radius:12px;min-width:180px;flex:1}.stat b{display:block;margin-bottom:5px}.stat small{color:#2d5b87}.cards{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;align-items:start}.week-col{display:flex;flex-direction:column;gap:12px;min-width:0}.card{background:white;border:1px solid #d5e1ef;border-radius:17px;padding:16px;box-shadow:0 3px 9px #1839560b}.qtop{display:flex;align-items:flex-start;gap:8px;justify-content:space-between;margin-bottom:14px}.qtitle{font-size:15px;line-height:1.48;font-weight:750}.pill{background:#e4f0ff;color:#15578d;padding:5px 8px;border-radius:7px;white-space:nowrap;font-size:12px}.opt{display:flex;align-items:baseline;text-align:left;gap:12px;width:100%;padding:13px 11px;border:1px solid #d9e2ed;border-radius:10px;background:#fff;color:#12314d;font:inherit;font-size:14px;line-height:1.45;cursor:pointer;margin-top:7px}.opt strong{min-width:18px}.opt:hover{border-color:#70a6d9;background:#f3f8ff}.opt.correct{background:#e7f8ec;border-color:#2d9b57}.opt.wrong{background:#fff0ee;border-color:#dc625b}.opt:disabled{cursor:default}.feedback{margin-top:12px;border-top:1px solid #e2e8f0;padding-top:12px;font-size:14px;line-height:1.5}.retry{border:0;background:transparent;color:#0b5894;font-weight:700;cursor:pointer;margin-top:11px;padding:3px 0}.feedback{border-radius:10px;padding:12px;background:#e9f8ef;border:1px solid #a8dcb8}.feedback.bad{background:#fff0ee;border-color:#efb4ae}.feedback strong{color:#155e36}.feedback .incorrect{color:#a33028}.explanation{background:#f0f6ff;border-radius:9px;padding:10px;margin-top:8px;color:#2c4b69}.week-head{background:#e6f1ff;border:1px solid #bedafa;border-radius:14px;padding:17px}.week-head b{display:block;font-size:17px}.week-head p{margin:5px 0;color:#496682;font-size:13px}.week-head small{color:#0b5894;font-weight:700}.desc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.desc-card h3{font-size:17px;line-height:1.5;margin:0 0 12px}.answer{white-space:pre-line;line-height:1.75;font-size:14px;border-top:1px solid #e3eaf2;margin-top:12px;padding-top:13px}.answer[hidden]{display:none}.desc-card .action{font-size:13px;padding:10px 13px}.utility{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 16px}.utility .action{font-size:13px}.progress{font-size:14px;color:#42627f;margin-left:auto}.presentation .cards{grid-template-columns:minmax(0,750px);justify-content:center}.presentation .week-head{display:none}.presentation .qtitle{font-size:21px}.presentation .opt{font-size:18px;padding:18px}.presentation .card{padding:24px}.presentation .week-col{display:contents}.hidden{display:none!important}@media(max-width:1250px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.cards,.desc-grid{grid-template-columns:1fr}.stat{min-width:120px}header{padding:20px}.presentation .qtitle{font-size:18px}}@media print{.toolbar,.utility,.action{display:none!important}.cards,.desc-grid{display:block}.card{break-inside:avoid;margin:10px 0}.answer[hidden]{display:block}.feedback{display:block}}
</style></head><body><header><h1>ITEC 310 · Internet of Things</h1><p>Interactive Question Bank · Weeks 1–3 · 20 Original MCQs + 6 Descriptive Questions</p></header><main><div class="toolbar" id="tabs"><button class="tab active" data-view="all">All weeks · 3 columns</button><button class="tab" data-view="1">Week 1</button><button class="tab" data-view="2">Week 2</button><button class="tab" data-view="3">Week 3</button><button class="tab" data-view="desc">Descriptive Questions</button><button class="tab" data-view="presentation">Presentation mode</button></div><p class="intro" id="intro">Choose A, B, C or D. <strong>Select an option first. Then the correct answer and a short explanation will appear. All question wording and answer options are unchanged.</p><div class="utility"><button class="action" id="reset">↻ Reset answers</button><button class="action" id="reveal">Show all descriptive answers</button><button class="action" id="hide">Hide descriptive answers</button><span class="progress" id="progress"></span></div><section id="mcq"><div class="stats" id="stats"></div><div class="cards" id="cards"></div></section><section id="descriptive" class="hidden"><div class="desc-grid" id="desc-grid"></div></section></main><script>
const questions=[{"id": 1, "week": 1, "question": "What is the main purpose of the Internet of Things (IoT)?", "options": ["Replace all computers with sensors", "Connect physical objects with digital systems", "Eliminate communication networks", "Store data without devices"], "answer": "B", "explanation": "IoT links physical objects, such as sensors and controllers, with digital systems so they can exchange data and support monitoring or control."}, {"id": 2, "week": 1, "question": "Which component processes sensor data and makes decisions?", "options": ["Actuator", "Dashboard", "Controller", "Network"], "answer": "C", "explanation": "A controller such as the ESP32 reads sensor data, applies programmed logic, and decides what should happen next."}, {"id": 3, "week": 1, "question": "A sensor measures 35°C and an ESP32 turns on a fan. What is the role of the fan?", "options": ["Sensor", "Communication device", "Processing unit", "Actuator"], "answer": "D", "explanation": "An actuator performs a physical action. The fan changes the classroom environment after receiving the controller's instruction."}, {"id": 4, "week": 1, "question": "What is the difference between monitoring and automation?", "options": ["Monitoring displays information; automation performs rule-based actions", "Monitoring always needs Internet; automation never does", "Monitoring controls actuators; automation only stores data", "Both perform the same function"], "answer": "A", "explanation": "Monitoring shows readings or status. Automation uses programmed conditions to take action without waiting for a user command."}, {"id": 5, "week": 1, "question": "A fan continues operating automatically when Internet connectivity is lost. What does this demonstrate?", "options": ["Cloud computing is required", "Dashboard makes all decisions", "Local control works without Internet", "Sensors cannot work without a network"], "answer": "C", "explanation": "The ESP32 can read a sensor and control a fan locally; it does not need a cloud connection for that rule to work."}, {"id": 6, "week": 1, "question": "Which security mechanism determines whether an authenticated user can control a device?", "options": ["Encryption", "Access control", "Data analytics", "Sensor calibration"], "answer": "B", "explanation": "Access control checks what an authenticated user is allowed to do, such as whether they have permission to operate a fan."}, {"id": 7, "week": 1, "question": "A user enters a username and password to access a dashboard. Which mechanism is used?", "options": ["Authentication", "Data analytics", "Actuation", "Network routing"], "answer": "A", "explanation": "Authentication checks a user's identity, commonly using login credentials."}, {"id": 8, "week": 2, "question": "Which ESP32 development-board feature allows sensors and actuators to connect?", "options": ["Cloud storage", "Web dashboard", "Input/output pins", "Remote database"], "answer": "C", "explanation": "Input/output (I/O) pins provide the electrical connections used to read sensors and send signals to actuators."}, {"id": 9, "week": 2, "question": "What is the main function of an IoT gateway?", "options": ["Replace sensors", "Collect device data and connect to wider networks", "Display information to users", "Perform physical actions"], "answer": "B", "explanation": "A gateway gathers or forwards information from IoT devices and helps connect them to other networks or services."}, {"id": 10, "week": 2, "question": "A university wants to store readings from 100 classrooms and access them remotely. Which component is suitable?", "options": ["Buzzer", "Relay", "Temperature sensor", "IoT cloud"], "answer": "D", "explanation": "Cloud services can store readings from many devices and make them accessible to authorized remote users."}, {"id": 11, "week": 2, "question": "Which component identifies patterns and trends in collected IoT data?", "options": ["IoT analytics", "IoT actuator", "Microcontroller pins", "Network antenna"], "answer": "A", "explanation": "IoT analytics examines collected readings to find patterns, trends, and useful insights."}, {"id": 12, "week": 2, "question": "What is the difference between an IoT cloud and an IoT application?", "options": ["Cloud measures temperature; application controls sensors", "Cloud performs physical actions; application provides communication", "Cloud provides storage/computing; application provides a user interface", "Both perform the same function"], "answer": "C", "explanation": "The cloud supplies remote computing and storage; the application is the interface through which users view information or interact with the system."}, {"id": 13, "week": 2, "question": "Which sequence represents collecting, storing, analyzing, and displaying IoT readings?", "options": ["Application → Sensor → Actuator → Cloud", "Smart Things → Gateway → Network → Cloud → Analytics → Application", "Cloud → Actuator → Sensor → User", "Gateway → Fan → Physical World → Sensor"], "answer": "B", "explanation": "This conceptual sequence follows data from connected things through networking and cloud storage to analytics and a user-facing application. Not every IoT deployment needs a separate gateway."}, {"id": 14, "week": 3, "question": "What does IoT network architecture mainly describe?", "options": ["Price of IoT devices", "Physical appearance of sensors", "Organization, connections, and communication between components", "Programming language of the controller"], "answer": "C", "explanation": "Architecture explains how devices, networks, processing services, and applications are arranged and exchange information."}, {"id": 15, "week": 3, "question": "A temperature reading travels from ESP32 through the Internet to a dashboard. What is this called?", "options": ["Data flow", "Control flow", "Physical action", "Authentication"], "answer": "A", "explanation": "Data flow is the movement of readings or status information from an IoT device toward an application or user."}, {"id": 16, "week": 3, "question": "A user presses Fan ON on a remote dashboard. Which path represents the command?", "options": ["Sensor → ESP32 → Dashboard → User", "Fan → Sensor → Application → User", "Application → Sensor → Cloud → User", "User → Application → Internet → ESP32 → Actuator"], "answer": "D", "explanation": "The command starts with the user, travels through the application and network, and reaches the ESP32, which operates the actuator."}, {"id": 17, "week": 3, "question": "What is bidirectional communication in IoT?", "options": ["Devices only send data to cloud", "Devices send data to applications, and applications send commands back", "Sensors only communicate with actuators", "Information travels in one direction"], "answer": "B", "explanation": "Bidirectional communication allows outgoing sensor/status data and incoming commands between the IoT device and application."}, {"id": 18, "week": 3, "question": "A classroom fan must operate during Internet failure while supporting remote monitoring. Which design is suitable?", "options": ["Remote processing for every decision", "Dashboard-only control", "Local automatic control + remote monitoring", "Cloud storage without local controller"], "answer": "C", "explanation": "The ESP32 can continue automatic fan control offline, while Internet connectivity provides optional remote monitoring when available."}, {"id": 19, "week": 3, "question": "What should a designer consider before selecting Wi-Fi, Bluetooth, ZigBee, or cellular communication?", "options": ["Application requirements, range, power, and data needs", "ESP32 board color", "Dashboard appearance", "Number of application icons"], "answer": "A", "explanation": "Communication technology should fit the application's required coverage, energy consumption, data volume, and operating conditions."}, {"id": 20, "week": 3, "question": "A university connects hundreds of classroom sensors across buildings. What is the most important network-design consideration?", "options": ["Every device must use Bluetooth", "All decisions must happen in cloud", "Gateways must be avoided", "Device count, coverage, reliability, and future expansion"], "answer": "D", "explanation": "A large deployment must support many devices, adequate network coverage, dependable operation, and room to grow."}];const descriptive=[{"id": 1, "question": "A smart classroom uses a temperature sensor, an ESP32, and a fan. The fan should turn ON when the temperature exceeds 30°C and turn OFF when it falls below 25°C.\nExplain how this IoT system operates. Identify the role of each component and describe the sequence of operations.", "answer": "The IoT system automatically controls the classroom temperature.\n1. Temperature Sensor: Measures the current classroom temperature.\n2. ESP32 Controller: Receives the sensor reading and applies programmed conditions.\n3. Decision: If the temperature is above 30°C, the ESP32 turns the fan ON. If it is below 25°C, the ESP32 turns the fan OFF. Between these thresholds, the fan keeps its previous state.\n4. Actuator: The fan performs the physical action.\n5. Continuous Operation: The system repeatedly measures the temperature and updates the fan when necessary.\nSystem Flow:\nTemperature Sensor → ESP32 → Decision → Fan ON/OFF\nThis is an example of local automatic control, which can operate without an Internet connection.", "level": 3}, {"id": 2, "question": "An IoT system allows users to monitor classroom temperatures remotely and control fans through a web application.\nAnalyze the difference between data flow and control flow in this system. Illustrate both flows using diagrams and explain the role of the ESP32.", "answer": "The IoT system uses two communication flows.\n1. Data Flow – Monitoring\nThe temperature sensor measures the classroom temperature.\nThe ESP32 receives the reading and sends it through the Internet to the web application.\nThe user can view the temperature remotely.\nTemperature Sensor → ESP32 → Internet → Web Application → User\n2. Control Flow – Remote Control\nThe user selects a command, such as Fan ON, in the web application.\nThe command travels through the Internet to the ESP32.\nThe ESP32 receives the command and activates the fan.\nUser → Web Application → Internet → ESP32 → Fan\nAnalysis:\n• Data flow transfers sensor readings from the device to the user.\n• Control flow transfers commands from the user to the device.\n• The ESP32 participates in both flows.\n• This is called bidirectional communication.", "level": 4}, {"id": 3, "question": "Explain the main components of an IoT system and how they work together.", "answer": "An IoT system connects physical objects with digital systems.\n• Sensors: Measure physical conditions such as temperature and motion.\n• Controller (ESP32): Processes sensor data and makes decisions.\n• Actuators: Perform actions such as turning a fan ON.\n• Communication: Connects devices through networks.\n• Application: Allows users to monitor and control devices.\n• Security: Protects devices and information.\nExample: Temperature Sensor → ESP32 → Fan ON", "level": null}, {"id": 4, "question": "Explain the difference between monitoring, control, and automation in IoT.", "answer": "• Monitoring: Collecting and displaying information, such as temperature on a dashboard.\n• Control: A user sends a command, such as Fan ON.\n• Automation: The system performs actions automatically based on programmed rules.\nExample: If temperature exceeds 30°C, the ESP32 automatically turns the fan ON.\nMain difference: Monitoring displays information, control involves user decisions, and automation uses programmed rules.", "level": null}, {"id": 5, "question": "Explain the difference between an IoT gateway, cloud, analytics, and application.", "answer": "• Gateway: Collects data from devices and forwards it to networks.\n• Cloud: Stores data and provides remote computing services.\n• Analytics: Analyzes data to identify patterns and trends.\n• Application: Displays information and allows user interaction.\nExample:\nGateway → Cloud → Analytics → Application\nThe gateway forwards temperature readings, the cloud stores them, analytics identifies high temperatures, and the application displays the results.", "level": null}, {"id": 6, "question": "Compare local automatic control, remote monitoring, and remote user control in IoT.", "answer": "1. Local Automatic Control\nThe ESP32 automatically controls an actuator without Internet access.\nSensor → ESP32 → Actuator\n2. Remote Monitoring\nThe user views sensor information through an application.\nSensor → ESP32 → Internet → Application → User\n3. Remote User Control\nThe user sends commands through an application to control a device.\nUser → Application → Internet → ESP32 → Actuator\nMain difference: Local control makes automatic decisions, remote monitoring displays data, and remote user control allows users to send commands.", "level": null}];
let selections={},view='all',presentIndex=0,descOpen={};const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={1:'Introduction to IoT',2:'IoT Building Blocks: Hardware and Software',3:'IoT Network Architecture and Design'};
function render(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));$('mcq').classList.toggle('hidden',view==='desc');$('descriptive').classList.toggle('hidden',view!=='desc');document.body.classList.toggle('presentation',view==='presentation');$('reset').classList.toggle('hidden',view==='desc');$('reveal').classList.toggle('hidden',view!=='desc');$('hide').classList.toggle('hidden',view!=='desc');$('intro').textContent=view==='desc'?'Read the descriptive questions and reveal the original model answers when ready.':'Choose A, B, C, or D first. After you select, the correct answer and a short explanation appear. You can try each question again. Original wording and options are unchanged.';
let answered=Object.keys(selections).length,correct=questions.filter(q=>selections[q.id]===q.answer).length;$('progress').textContent=`${answered} / 20 answered · ${correct} correct`;
if(view==='desc'){renderDesc();return}let weeks=view==='all'?[1,2,3]:view==='presentation'?[questions[presentIndex].week]:[Number(view)];$('stats').innerHTML=weeks.map(w=>{let n=questions.filter(q=>q.week===w),a=n.filter(q=>selections[q.id]).length;return `<div class="stat"><b>WEEK ${w}</b><small>${escapeHTML(names[w])}<br>${a} of ${n.length} answered</small></div>`}).join('');
$('cards').innerHTML=view==='presentation'?`<div class="week-col">${card(questions[presentIndex])}<div class="utility"><button class="action" id="prev">← Previous</button><strong>Question ${presentIndex+1} of 20</strong><button class="action" id="next">Next →</button></div></div>`:weeks.map(w=>`<div class="week-col"><div class="week-head"><b>WEEK ${w}</b><p>${escapeHTML(names[w])}</p><small>${questions.filter(q=>q.week===w&&selections[q.id]).length} of ${questions.filter(q=>q.week===w).length} answered</small></div>${questions.filter(q=>q.week===w).map(card).join('')}</div>`).join('');
$('cards').querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{let id=Number(b.dataset.id);if(!selections[id]){selections[id]=b.dataset.choice;render()}}));$('cards').querySelectorAll('[data-retry]').forEach(b=>b.addEventListener('click',()=>{delete selections[Number(b.dataset.retry)];render()}));if(view==='presentation'){$('prev').onclick=()=>{presentIndex=Math.max(0,presentIndex-1);render()};$('next').onclick=()=>{presentIndex=Math.min(19,presentIndex+1);render()}}
}
function card(q){let selected=selections[q.id];let answerIndex='ABCD'.indexOf(q.answer);return `<article class="card"><div class="qtop"><div class="qtitle">Q${q.id}. ${escapeHTML(q.question)}</div><span class="pill">Week ${q.week}</span></div>${q.options.map((o,i)=>{let letter='ABCD'[i];let cls=selected?(letter===q.answer?' correct':letter===selected?' wrong':''):'';return `<button class="opt${cls}" data-id="${q.id}" data-choice="${letter}" ${selected?'disabled':''}><strong>${letter}.</strong><span>${escapeHTML(o)}</span></button>`}).join('')}${selected?`<div class="feedback ${selected===q.answer?'':'bad'}">${selected?`<strong class="${selected===q.answer?'':'incorrect'}">${selected===q.answer?'✓ Correct!':'✕ Not quite.'}</strong>`:''}<div><b>Correct answer: ${q.answer}. ${escapeHTML(q.options[answerIndex])}</b></div><div class="explanation"><b>Why this is correct:</b> ${escapeHTML(q.explanation)}</div></div><button class="retry" data-retry="${q.id}">Try this question again ↻</button>`:''}</article>`}
function renderDesc(){$('desc-grid').innerHTML=descriptive.map(q=>`<article class="card desc-card"><div class="qtop"><span class="pill">Question ${q.id}${q.level?' · Level '+q.level:''}</span></div><h3>${escapeHTML(q.question).replace(/\n/g,'<br>')}</h3><button class="action" data-desc="${q.id}">${descOpen[q.id]?'Hide answer':'Show answer'}</button><div class="answer" ${descOpen[q.id]?'':'hidden'}><b>Answer:</b>\n${escapeHTML(q.answer)}</div></article>`).join('');$('desc-grid').querySelectorAll('[data-desc]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.desc);descOpen[id]=!descOpen[id];renderDesc()})}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'})});$('reset').onclick=()=>{if(confirm('Clear all MCQ answers and start again?')){selections={};render()}};$('reveal').onclick=()=>{descriptive.forEach(q=>descOpen[q.id]=true);renderDesc()};$('hide').onclick=()=>{descOpen={};renderDesc()};render();
</script></body></html>
