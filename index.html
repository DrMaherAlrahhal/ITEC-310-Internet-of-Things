<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITEC 310 - Internet of Things</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #142c4c;
    }

    header {
      background: #164e63;
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      margin: 0 0 15px;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000012;
    }

    .card h2 {
      margin-top: 0;
    }

    .button {
      display: inline-block;
      background: #087e8b;
      color: white;
      padding: 12px 18px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #065f69;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #667;
    }
  </style>
</head>

<body>

  <header>
    <h1>ITEC 310 - Internet of Things</h1>
    <p>Interactive Learning Labs</p>
    <p>Dr. Maher Alrahhal</p>
  </header>

  <main>
    <h2>Weekly Learning Activities</h2>
    <div class="grid" id="weeks"></div>
  </main>

  <footer>
    ITEC 310 | Internet of Things
  </footer>

  <script>
    const weeks = [
      {
        title: "Week 1",
        url: "./Week-1/index.html"
      },
      {
        title: "Week 2",
        url: "./Week-2/index.html"
      },
      {
        title: "Weeks 3 & 4",
        url: "./Week-3-and-4/index.html"
      },
      {
        title: "Week 5",
        url: "./Week-5/index.html"
      },
      {
        title: "Week 6",
        url: "./Week-6/index.html"
      },
      {
        title: "Week 7",
        url: "./Week-7/index.html"
      },
      {
        title: "Week 8",
        url: "./Week-8/index.html"
      },
      {
        title: "Week 9",
        url: "./Week-9/index.html"
      },
      {
        title: "Week 10",
        url: "./Week-10/index.html"
      },
      {
        title: "Week 11",
        url: "./Week-11/index.html"
      },
      {
        title: "Week 12",
        url: "./Week-12/index.html"
      },
      {
        title: "Week 13",
        url: "./Week-13/index.html"
      },
      {
        title: "Week 14",
        url: "./Week-14/index.html"
      },
      {
        title: "Week 15",
        url: "./Week-15/index.html"
      }
    ];

    const container = document.getElementById("weeks");

    weeks.forEach(week => {

      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = week.title;
      card.appendChild(title);

      const description = document.createElement("p");
      description.textContent =
        week.title === "Weeks 3 & 4"
          ? "Combined Interactive IoT Learning Lab"
          : "Interactive Learning Lab";

      card.appendChild(description);

      const link = document.createElement("a");
      link.className = "button";
      link.href = week.url;
      link.textContent = "Open Learning Lab";

      card.appendChild(link);
      container.appendChild(card);

    });
  </script>

</body>
</html>
